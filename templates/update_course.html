<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <h2>Update Course</h2>

    <form
      action="{{ url_for('update_course', course_id=course.course_id) }}"
      method="POST"
      id="update-course-form"
    >
      <div>
        <label>Course Code:</label>
        <input type="text" name="code" value="{{ course.course_code }}" readonly />
      </div>
      <div>
        <label>Course Name:</label>
        <input type="text" name="c_name" value="{{ course.course_name }}" required />
      </div>
      <div>
        <label>Course Description:</label>
        <input type="text" name="desc" value="{{ course.course_description }}" />
      </div>
      <div>
        <input type="submit" value="Submit" />
      </div>
    </form>
  </body>
</html>
